<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111326">
  <title>Sakura Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🌸</span><div><b>Sakura</b><small>Messenger</small></div></div>
    <div class="me"><div class="avatar meAvatar">S</div><div><b>Мой профиль</b><small id="myStatus">в сети</small></div><button id="settingsBtn">⚙</button></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="Поиск чатов"></div>
    <div class="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="unread">Непрочитанные</button><button class="filter" data-filter="groups">Группы</button></div>
    <div id="chatList" class="chatList"></div>
  </aside>

  <main class="chatWindow">
    <header class="chatHeader">
      <button id="backBtn" class="mobileOnly">‹</button>
      <div id="headerAvatar" class="avatar">A</div>
      <div class="headInfo"><b id="headerName">Акира</b><small id="headerStatus">в сети</small></div>
      <div class="headActions"><button title="Поиск">⌕</button><button title="Звонок" id="callBtn">☎</button><button title="Меню">⋮</button></div>
    </header>

    <section id="messages" class="messages"></section>

    <div id="typing" class="typing hidden">печатает…</div>
    <form id="composer" class="composer">
      <button type="button" id="attachBtn" title="Вложение">📎</button>
      <input id="messageInput" autocomplete="off" placeholder="Напишите сообщение…">
      <button type="button" id="emojiBtn" title="Эмодзи">☺</button>
      <button class="send" type="submit">➤</button>
      <input id="fileInput" type="file" hidden>
    </form>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modalCard">
      <button class="close" id="closeModal">×</button>
      <h2>Профиль</h2>
      <div class="profileBig"><div class="avatar big meAvatar">S</div></div>
      <input id="profileName" placeholder="Ваше имя">
      <button id="saveProfile" class="primary">Сохранить</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
